<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eco-Explorer — Penjaga Keseimbangan Ekosistem</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="stage">
  <section class="screen" id="scr-title">
    <canvas class="cv" id="cv-title" width="1920" height="1080"></canvas>
    <div class="ui title-ui">
      <div class="title-kicker">MEDIA PEMBELAJARAN INTERAKTIF IPAS &bull; FASE C &bull; KELAS 5</div>
      <h1 class="title-logo">ECO-EXPLORER</h1>
      <div class="title-sub">Penjaga Keseimbangan Ekosistem Nusantara</div>
      <div class="title-gita-row">
        <div id="gita-title"></div>
        <div class="gita-bubble panel" id="bubble-title"></div>
      </div>
      <div class="title-btns">
        <button class="menu-card green" id="btn-start">
          <span class="menu-ic"><svg width="48" height="48" viewBox="0 0 24 24" fill="#fff"><path d="M8 5l11 7-11 7Z"/></svg></span>
          <span class="mc-t">MULAI PETUALANGAN</span>
          <span class="mc-s">Pilih Tim &amp; Jalankan 8 Misi</span>
          <span class="go">&gt;&gt;&gt;</span>
        </button>
        <button class="menu-card blue" id="btn-how">
          <span class="menu-ic"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1-2-2Z"/><path d="M8 3v18"/></svg></span>
          <span class="mc-t">CARA BERMAIN</span>
          <span class="mc-s">Pelajari Aturan &amp; Tugas Misi</span>
          <span class="go">&gt;&gt;&gt;</span>
        </button>
        <button class="menu-card purple" id="btn-teacher">
          <span class="menu-ic"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6"/><circle cx="17.5" cy="9" r="3"/><path d="M14.5 14.5c3.5 0 6.5 2 6.5 5.5"/></svg></span>
          <span class="mc-t">PANDUAN GURU</span>
          <span class="mc-s">Kurikulum &amp; Petunjuk Guru</span>
          <span class="go">&gt;&gt;&gt;</span>
        </button>
      </div>
      <button class="btn tb-btn snd-btn" id="t-snd" style="position:absolute;right:30px;top:26px"></button>
      <div class="title-foot">SDN Percobaan 2 Malang &bull; Kelas 5A &bull; 4 Ekosistem &bull; 8 Misi &bull; Progres tersimpan: <span id="foot-stars">0</span>/24 bintang</div>
    </div>
  </section>
  <section class="screen" id="scr-tutorial"></section>
  <section class="screen" id="scr-team"></section>
  <section class="screen" id="scr-biome"></section>
  <section class="screen" id="scr-mission"></section>
  <section class="screen" id="scr-sim">
    <canvas class="cv" id="cv-sim" width="1920" height="1080"></canvas>
    <div class="ui" id="sim-ui"></div>
    <div id="sim-bridge" class="bridge-wrap" style="display:none">
      <div class="bridge-panel">
        <div class="bridge-char">
          <div class="bridge-avatar" id="bridge-gita-box"></div>
          <div class="bridge-nameplate">GITA &bull; Detektif Alam</div>
        </div>
        <div class="bridge-body">
          <div class="bridge-step-pill" id="bridge-step-pill">Petunjuk Awal Misi &bull; Langkah 1 dari 2</div>
          <h3 class="bridge-title" id="bridge-title"></h3>
          <p class="bridge-text" id="bridge-text"></p>
          <div class="bridge-team-shout" id="bridge-team-shout"></div>
        </div>
        <div class="bridge-right">
          <div class="bridge-team-badge">
            <canvas id="bridge-mascot-cv" width="110" height="110"></canvas>
            <div class="bridge-team-name" id="bridge-team-name"></div>
            <div class="bridge-team-role" id="bridge-team-role"></div>
          </div>
          <div class="bridge-actions">
            <button class="btn btn-gold" id="bridge-btn-next">Lanjut &gt;</button>
            <button class="btn btn-secondary" id="bridge-btn-skip">Lewati</button>
          </div>
        </div>
      </div>
    </div>

  </section>
  <section class="screen" id="scr-quiz"></section>
  <section class="screen" id="scr-victory">
    <canvas class="cv" id="cv-confetti" width="1920" height="1080"></canvas>
    <div class="ui vwrap" id="victory-ui"></div>
  </section>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>

  <!-- CORE SCRIPTS & STATE -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>

  <!-- DATA LAYER -->
  <script src="js/data/ecosystems.js"></script>
  <script src="js/data/missions.js"></script>

  <!-- RENDERERS -->
  <script src="js/renderers/characters.js"></script>
  <script src="js/renderers/backgrounds.js"></script>

  <!-- SCENE CONTROLLERS -->
  <script src="js/scenes/title.js"></script>
  <script src="js/scenes/tutorial.js"></script>
  <script src="js/scenes/team.js"></script>
  <script src="js/scenes/biome.js"></script>
  <script src="js/scenes/mission-menu.js"></script>
  <script src="js/scenes/simulation.js"></script>
  <script src="js/scenes/quiz.js"></script>
  <script src="js/scenes/victory.js"></script>

  <!-- ENTRY POINT -->
  <script src="js/main.js"></script>
</body>
</html>
