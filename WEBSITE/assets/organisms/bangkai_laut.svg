      <line x1="58" y1="30" x2="58" y2="60" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <line x1="71" y1="32" x2="71" y2="58" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <!-- Tail Bone -->
